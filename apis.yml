name: Ordermark
description: >-
  Ordermark is a restaurant technology company that consolidates online food
  delivery and takeout orders from third-party channels such as DoorDash, Uber
  Eats, Grubhub, and Postmates into a single dashboard and printer, with menu
  synchronization, order management, and analytics across delivery partners and
  250+ POS systems. Ordermark was acquired by and now operates under UrbanPiper;
  the ordermark.com property is maintained by UrbanPiper. As of this enrichment
  pass Ordermark publishes no public developer API, developer portal, API
  documentation, or SDKs on its own surface. It was surfaced to the API
  Evangelist network as a Techstars portfolio company lead.
